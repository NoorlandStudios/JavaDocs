name: Build Aggregated Javadocs
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central docs repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (for Gradle modules)
        uses: gradle/actions/setup-gradle@v3

      - name: Checkout NoorCore
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorCore
          path: NoorCore
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout NoorNPCs
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorNPCs
          path: NoorNPCs
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout NoorItems
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorItems
          path: NoorItems
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout NoorEntities
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorEntities
          path: NoorEntities
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout NoorUtils
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorUtils
          path: NoorUtils
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout NoorMenus
        uses: actions/checkout@v4
        with:
          repository: NoorlandStudios/NoorMenus
          path: NoorMenus
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install all projects and collect classpaths
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/javadoc-init.gradle << 'EOF'
          pluginManagement {
            repositories {
              gradlePluginPortal()
              maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
            }
          }
          allprojects {
            repositories {
              mavenLocal()
              mavenCentral()
              maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
            }
            afterEvaluate {
              if (!plugins.hasPlugin('maven-publish')) {
                apply plugin: 'maven-publish'
                publishing {
                  publications {
                    maven(MavenPublication) {
                      from components.findByName('java') ?: components.findByName('javaPlatform')
                    }
                  }
                }
              }
              if (!tasks.findByName('printRuntimeClasspath')) {
                tasks.register('printRuntimeClasspath') {
                  doLast {
                    def cp = configurations.findByName('runtimeClasspath')
                    if (cp) println cp.asPath
                  }
                }
              }
            }
          }
          EOF

          get_classpath() {
            local dir="$1"

            if [ -f "$dir/pom.xml" ]; then
              echo "[$dir] Detected Maven" >&2
              mvn -f "$dir/pom.xml" clean install -DskipTests -q || return 1
              mvn -f "$dir/pom.xml" dependency:build-classpath \
                -Dmdep.outputFile=/dev/stdout -q 2>/dev/null

            elif [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              echo "[$dir] Detected Gradle" >&2
              (cd "$dir" && ./gradlew publishToMavenLocal -q) || return 1
              (cd "$dir" && ./gradlew printRuntimeClasspath -q \
                2>/dev/null | grep -v '^>' | grep -v '^\[' | grep ':' | tail -1)

            else
              echo "[$dir] WARNING: No recognised build file found, skipping." >&2
            fi
          }

          MODULES=(NoorItems NoorEntities NoorNPCs NoorCore NoorUtils NoorMenus)
          FULL_CP=""
          FAILED=()

          for MODULE in "${MODULES[@]}"; do
            echo "--- Processing $MODULE ---"
            CP=$(get_classpath "$MODULE") || { FAILED+=("$MODULE"); continue; }
            if [ -n "$CP" ]; then
              FULL_CP="${FULL_CP:+$FULL_CP:}$CP"
            else
              echo "[$MODULE] WARNING: empty classpath, module may have no runtimeClasspath config" >&2
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "ERROR: The following modules failed to build: ${FAILED[*]}" >&2
            exit 1
          fi

          echo "FULL_CP=$FULL_CP" >> $GITHUB_ENV

      - name: Collect source files
        run: |
          find NoorCore/src/main/java \
               NoorNPCs/src/main/java \
               NoorItems/src/main/java \
               NoorEntities/src/main/java \
               NoorUtils/src/main/java \
               NoorMenus/src/main/java \
            -name "*.java" 2>/dev/null > sources.txt

          echo "Found $(wc -l < sources.txt) source files"

      - name: Generate Aggregated Javadocs
        run: |
          mkdir -p docs
          javadoc \
            -J-Xmx2g \
            -d docs \
            -encoding UTF-8 \
            -classpath "$FULL_CP" \
            -windowtitle "Noorland Aggregated Javadocs" \
            -doctitle "Noorland Aggregated Javadocs" \
            -Xdoclint:none \
            -quiet \
            @sources.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs
          git commit -m "Update aggregated Javadocs [skip ci]" || echo "No changes to commit"
          git push
